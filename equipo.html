<title>COVA · equipo</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #05050a; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #ropes { position: fixed; inset: 0; display: block; }

  .card {
    position: fixed; left: 0; top: 0; z-index: 2;
    border-radius: 12px; overflow: hidden; background: #111;
    box-shadow: 0 0 0 1px rgba(255,255,255,.18), 0 14px 40px rgba(0,0,0,.6);
    cursor: grab; touch-action: none; will-change: transform;
  }
  .card.drag { cursor: grabbing; z-index: 3; box-shadow: 0 0 0 2px #fff, 0 20px 50px rgba(0,0,0,.7); }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .card .ph {                       /* hueco si la foto aún no existe */
    position: absolute; inset: 0; display: grid; place-items: center;
    background: linear-gradient(160deg, #1d1d2b, #0b0b12);
  }
  .card .ph svg { width: 46%; opacity: .5; }
  .card .name {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 7px;
    font-size: 12px; font-weight: 600; text-align: center; letter-spacing: .03em;
    background: linear-gradient(transparent, rgba(0,0,0,.75)); pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  #label {
    position: fixed; left: 0; top: 0; z-index: 4; pointer-events: none;
    font: 900 clamp(26px, 5vw, 56px)/1 system-ui, sans-serif; letter-spacing: .06em;
    color: #fff; white-space: nowrap; text-shadow: 0 4px 24px rgba(0,0,0,.8);
    opacity: 0; transition: opacity .25s;
  }
  #label.show { opacity: 1; }
  #back {
    position: fixed; left: 16px; top: 14px; z-index: 5; color: #fff; text-decoration: none;
    display: flex; align-items: center; gap: 6px; font-size: 14px; opacity: .7;
  }
  #back:hover { opacity: 1; }
  #back svg { width: 26px; height: 26px; }
</style>

const PHOTOS = [
  { src: FOTO_1, nombre: 'Capitana', url: 'https://www.instagram.com/capitanacapitanacapitana/' },
  { src: FOTO_2, nombre: 'Sp.Ice', url: 'https://www.instagram.com/sp.icemusic/' },
  { src: FOTO_3, nombre: 'Yulie', url: 'https://www.instagram.com/yu.li.e/' },
  { src: FOTO_4, nombre: 'Ruxi', url: 'https://www.instagram.com/ruxiruxiruxiruxiruxi/' },
  { src: FOTO_5, nombre: 'Dokku', url: 'https://www.instagram.com/iam_dokku/' },
  { src: FOTO_6, nombre: 'Deadclou', url: 'https://www.instagram.com/deadclou/' },
  { src: FOTO_7, nombre: 'Tearman T', url: 'https://www.instagram.com/tearman__t/' },
];
// Grupos unidos por cable (índices de PHOTOS). La que no aparece queda suelta.
const GROUPS = [[0, 1, 2], [3, 4, 5]];
// Nombre que aparece encima al agarrar cada grupo, y el de la foto suelta
const GROUP_NAMES = ['REWINE SOCIETY', 'BARNA92'];
const SOLO_NAME = 'KUADRA';

/* ===================== AJUSTES DE FÍSICA ===================== */
const CARD_MASS   = 6;     // las fotos pesan más que el cable
const ROPE_NODES  = 10;    // puntos de cada tramo de cable (más = más flexible)
const ROPE_SLACK  = 1.55;  // distancia de centro a centro, en tamaños de foto (1 = fotos pegadas)
const ROPE_GRAV   = 0.15;  // el cable cuelga por su peso
const CARD_GRAV   = 0.12;  // las fotos caen por su peso (más bajo = más lento)
const ROPE_WIDTH  = 6;     // grosor del cable (px)
const DAMP_CARD   = 0.985; // rozamiento de las fotos (1 = sin rozamiento)
const DAMP_ROPE   = 0.97;
const ITER        = 14;    // iteraciones del solver (más = cable más firme)

/* ===================== ESCENA ===================== */
const canvas = document.getElementById('ropes');
const ctx = canvas.getContext('2d');
let W, H, S;               // S = lado de cada foto

const bodies = [];         // { x, y, px, py, im (1/masa), card? }
const links  = [];         // { a, b, rest }
const ropes  = [];         // lista de índices de cuerpos para dibujar cada cable
const cards  = [];         // { el, b (índice cuerpo) }

function addBody(x, y, im) { bodies.push({ x, y, px: x, py: y, im }); return bodies.length - 1; }

function placeholder() {
  return `<div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5">
    <circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></div>`;
}

function makeCard(i, x, y, group) {
  const el = document.createElement('div');
  el.className = 'card';
  el.title = PHOTOS[i].nombre + ' · Instagram';
  el.innerHTML = placeholder() + `<div class="name"></div>`;
  el.querySelector('.name').textContent = PHOTOS[i].nombre;
  const img = new Image();
  img.alt = PHOTOS[i].nombre; img.draggable = false;
  img.onload = () => { el.querySelector('.ph')?.remove(); el.prepend(img); };
  img.src = PHOTOS[i].src;
  document.body.appendChild(el);
  const b = addBody(x, y, 1 / CARD_MASS);
  bodies[b].card = true;
  cards.push({ el, b, group, url: PHOTOS[i].url });
  enableDrag(el, b);
  return b;
}

function connect(a, b) {
  // cable de a → b con ROPE_NODES puntos intermedios
  const total = S * ROPE_SLACK, rest = total / (ROPE_NODES + 1);
  const A = bodies[a], B = bodies[b], chain = [a];
  let prev = a;
  for (let k = 1; k <= ROPE_NODES; k++) {
    const t = k / (ROPE_NODES + 1);
    const n = addBody(A.x + (B.x - A.x) * t, A.y + (B.y - A.y) * t, 1);
    links.push({ a: prev, b: n, rest }); chain.push(n); prev = n;
  }
  links.push({ a: prev, b, rest }); chain.push(b);
  ropes.push(chain);
}

function build() {
  S = Math.round(Math.max(90, Math.min(170, Math.min(W, H) * 0.17)));
  cards.forEach(c => { c.el.style.width = c.el.style.height = S + 'px'; });

  const used = new Set(GROUPS.flat());
  // cada grupo, en horizontal y a distinta altura
  GROUPS.forEach((g, gi) => {
    const cy = H * (gi === 0 ? 0.3 : 0.7);
    const span = S * 1.4;
    const cx = W / 2 + (gi === 0 ? -S * 1.2 : S * 1.2);
    // colocadas en triángulo (lado = span)
    const rad = span / Math.sqrt(3), rot = Math.random() * Math.PI * 2;
    const ids = g.map((p, k) => {
      const ang = rot + k * Math.PI * 2 / g.length;
      return makeCard(p, cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad, gi);
    });
    // cuerdas en triángulo: 1–2, 2–3 y 3–1
    for (let k = 0; k < ids.length; k++) connect(ids[k], ids[(k + 1) % ids.length]);
  });
  // las sueltas
  PHOTOS.forEach((_, i) => {
    if (!used.has(i)) makeCard(i, W * 0.85, H * 0.5, -1);
  });
  cards.forEach(c => { c.el.style.width = c.el.style.height = S + 'px'; });
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ===================== ARRASTRE ===================== */
let drag = null;   // { b, ox, oy, tx, ty, im, group }
const labelEl = document.getElementById('label');
function enableDrag(el, b) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    const B = bodies[b];
    drag = { b, el, ox: e.clientX - B.x, oy: e.clientY - B.y, tx: B.x, ty: B.y, im: B.im,
             sx: e.clientX, sy: e.clientY, st: performance.now(), moved: false };
    B.im = 0;                                      // mientras se arrastra, manda el dedo
    el.classList.add('drag');
    const g = cards.find(c => c.b === b).group;
    drag.group = g;
    labelEl.textContent = g >= 0 ? GROUP_NAMES[g] : SOLO_NAME;
    labelEl.classList.add('show');
  });
  el.addEventListener('pointermove', e => {
    if (!drag || drag.b !== b) return;
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8) drag.moved = true;
    drag.tx = e.clientX - drag.ox; drag.ty = e.clientY - drag.oy;
  });
  const end = e => {
    if (!drag || drag.b !== b) return;
    // toque corto sin arrastrar = abrir su Instagram
    if (e.type === 'pointerup' && !drag.moved && performance.now() - drag.st < 350) {
      const c = cards.find(c => c.b === b);
      if (c.url) window.open(c.url, '_blank', 'noopener');
    }
    bodies[b].im = drag.im;                         // al soltar conserva la inercia
    el.classList.remove('drag');
    labelEl.classList.remove('show');
    drag = null;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

/* ===================== FÍSICA (Verlet) ===================== */
function integrate() {
  for (const B of bodies) {
    if (drag && bodies[drag.b] === B) {
      B.px = B.x; B.py = B.y;
      B.x = Math.min(Math.max(S / 2, drag.tx), W - S / 2);
      B.y = Math.min(Math.max(S / 2, drag.ty), H - S / 2);
      continue;
    }
    const d = B.card ? DAMP_CARD : DAMP_ROPE;
    const vx = (B.x - B.px) * d, vy = (B.y - B.py) * d + (B.card ? CARD_GRAV : ROPE_GRAV);
    B.px = B.x; B.py = B.y;
    B.x += vx; B.y += vy;
  }
}

function solveLinks() {
  for (const L of links) {
    const A = bodies[L.a], B = bodies[L.b];
    const dx = B.x - A.x, dy = B.y - A.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 0.001;
    if (d <= L.rest) continue;                      // cable flojo: no empuja
    const w = A.im + B.im; if (w === 0) continue;
    const k = (d - L.rest) / d / w;
    A.x += dx * k * A.im; A.y += dy * k * A.im;
    B.x -= dx * k * B.im; B.y -= dy * k * B.im;
  }
}

function solveCards() {
  const h = S / 2 + 1;
  for (let i = 0; i < cards.length; i++) {
    for (let j = i + 1; j < cards.length; j++) {
      const A = bodies[cards[i].b], B = bodies[cards[j].b];
      const dx = B.x - A.x, dy = B.y - A.y;
      const ox = 2 * h - Math.abs(dx), oy = 2 * h - Math.abs(dy);
      if (ox <= 0 || oy <= 0) continue;
      const w = A.im + B.im; if (w === 0) continue;
      if (ox < oy) {
        const s = Math.sign(dx) || 1, m = ox / w;
        A.x -= s * m * A.im; B.x += s * m * B.im;
      } else {
        const s = Math.sign(dy) || 1, m = oy / w;
        A.y -= s * m * A.im; B.y += s * m * B.im;
      }
    }
  }
}

function solveWalls() {
  for (const B of bodies) {
    if (B.im === 0) continue;
    const r = B.card ? S / 2 : 1;
    if (B.x < r)     { const v = B.x - B.px; B.x = r;     B.px = B.x + v * 0.5; }
    if (B.x > W - r) { const v = B.x - B.px; B.x = W - r; B.px = B.x + v * 0.5; }
    if (B.y < r)     { const v = B.y - B.py; B.y = r;     B.py = B.y + v * 0.5; }
    if (B.y > H - r) { const v = B.y - B.py; B.y = H - r; B.py = B.y + v * 0.5; }
  }
}

/* ===================== DIBUJO ===================== */
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = ROPE_WIDTH; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const chain of ropes) {
    const P = chain.map(i => bodies[i]);
    ctx.beginPath();
    ctx.moveTo(P[0].x, P[0].y);
    for (let k = 1; k < P.length - 1; k++) {        // curva suave entre los puntos
      const mx = (P[k].x + P[k + 1].x) / 2, my = (P[k].y + P[k + 1].y) / 2;
      ctx.quadraticCurveTo(P[k].x, P[k].y, mx, my);
    }
    ctx.lineTo(P[P.length - 1].x, P[P.length - 1].y);
    ctx.stroke();
  }
  if (drag) {
    const members = cards.filter(c => c.group === drag.group && (drag.group >= 0 || c.b === drag.b));
    let minX = Infinity, maxX = -Infinity, minY = Infinity;
    for (const c of members) {
      const B = bodies[c.b];
      minX = Math.min(minX, B.x - S / 2); maxX = Math.max(maxX, B.x + S / 2); minY = Math.min(minY, B.y - S / 2);
    }
    const lw = labelEl.offsetWidth, lh = labelEl.offsetHeight;
    const lx = Math.min(Math.max(10, (minX + maxX) / 2 - lw / 2), W - lw - 10);
    const ly = Math.max(10, minY - lh - 18);
    labelEl.style.transform = `translate3d(${lx}px, ${ly}px, 0)`;
  }
  for (const c of cards) {
    const B = bodies[c.b];
    c.el.style.transform = `translate3d(${B.x - S / 2}px, ${B.y - S / 2}px, 0)`;
  }
}

function frame() {
  integrate();
  for (let k = 0; k < ITER; k++) { solveLinks(); solveCards(); solveWalls(); }
  draw();
  requestAnimationFrame(frame);
}

/* ===================== INICIO ===================== */
resize();
build();
addEventListener('resize', resize);
requestAnimationFrame(frame);
</script>
</body>
